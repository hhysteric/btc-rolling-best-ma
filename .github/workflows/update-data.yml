name: Update BTC daily data

# 每天 UTC 01:10 跑一次（北京时间 09:10），保证 UTC 前一天已收盘。
# 也可以在 Actions 页面手动 Run workflow。
on:
  schedule:
    - cron: '10 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Append latest daily candles
        run: python scripts/update_data.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain data/btc-daily.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/btc-daily.json
            git commit -m "chore(data): update btc-daily.json through $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data change."
          fi
